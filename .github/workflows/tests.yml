# Thin caller: runs the full CI pipeline. Keeping the jobs in ci.yml
# (workflow_call) means release.yml runs the exact same pipeline rather than
# a copy that can drift.
#
# Every branch runs on push. Pushing a branch is how changes get tested here;
# they usually reach main without a pull request, so a trigger that waited for
# one would leave most changes untested.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
