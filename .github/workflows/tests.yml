# Thin caller: runs the full CI pipeline. Keeping the jobs in ci.yml
# (workflow_call) means release.yml runs the exact same pipeline rather than
# a copy that can drift.
#
# project-standards deviation: the standard tests.yml is `on: [push,
# pull_request]` across all branches. Push is restricted to main and tags
# here (plan.md §6) so a PR from a branch in this repo runs the matrix once
# instead of twice; pull_request still covers every branch.
name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
